name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UpdateHub.sln

      - name: Build
        run: dotnet build UpdateHub.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/UpdateHub.Tests/UpdateHub.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/UpdateHub.App/UpdateHub.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      - name: Publish (self-contained, no .NET install needed)
        run: >
          dotnet publish src/UpdateHub.App/UpdateHub.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}-selfcontained

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath UpdateHub-${{ matrix.rid }}.zip
          Compress-Archive -Path publish/${{ matrix.rid }}-selfcontained/* -DestinationPath UpdateHub-${{ matrix.rid }}-selfcontained.zip

      - uses: actions/upload-artifact@v4
        with:
          name: UpdateHub-${{ matrix.rid }}
          path: |
            UpdateHub-${{ matrix.rid }}.zip
            UpdateHub-${{ matrix.rid }}-selfcontained.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UpdateHub-${{ matrix.rid }}.zip
            UpdateHub-${{ matrix.rid }}-selfcontained.zip
