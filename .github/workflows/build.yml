name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UpdateHub.sln

      - name: Build
        run: dotnet build UpdateHub.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/UpdateHub.Tests/UpdateHub.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/UpdateHub.App/UpdateHub.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      - name: Publish (self-contained, no .NET install needed)
        run: >
          dotnet publish src/UpdateHub.App/UpdateHub.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}-selfcontained

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath UpdateHub-${{ matrix.rid }}.zip
          Compress-Archive -Path publish/${{ matrix.rid }}-selfcontained/* -DestinationPath UpdateHub-${{ matrix.rid }}-selfcontained.zip

      - uses: actions/upload-artifact@v4
        with:
          name: UpdateHub-${{ matrix.rid }}
          path: |
            UpdateHub-${{ matrix.rid }}.zip
            UpdateHub-${{ matrix.rid }}-selfcontained.zip

  # One release per tag (or per manual run that sets release_tag), built from both matrix jobs.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: UpdateHub-*
          merge-multiple: true
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: UpdateHub ${{ inputs.release_tag || github.ref_name }}
          body: |
            **İndirme:** `UpdateHub-win-x64-selfcontained.zip` dosyasını indirip açın ve `UpdateHub.exe` dosyasını yönetici olarak çalıştırın (.NET kurulumu gerekmez).
            ARM64 cihazlar için `UpdateHub-win-arm64-selfcontained.zip`. `-selfcontained` olmayan paketler .NET 8 Desktop Runtime ister.
          files: dist/*.zip
